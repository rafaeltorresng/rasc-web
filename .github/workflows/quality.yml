name: Website quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e -- --project=chromium --project=firefox --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-regression-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  film-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: film
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: film/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run verify:native-demo
      - run: python3 -m py_compile native-harness/build.py native-harness/verify.py native-harness/capture-flow.py
